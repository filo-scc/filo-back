schema_version: "1.0"
identity:
  name: data-integrity-review
  display_name: Data Integrity Review
  summary: Audita atomicidade, invariantes persistidas, precisão, retry e concorrência em operações do FILO.
governance:
  owner: Gheyson
  reviewers:
    - Arthur Capistrano
    - Lucas de Holanda
  lifecycle_status: ativa-informativa
  last_review: 2026-09-12
  next_review: 2026-11-30
scope:
  repositories: [filo-back]
  canonical_repository: filo-back
  objective: Provar que operações compostas preservam estado válido sob sucesso, falha intermediária, repetição e concorrência.
  non_objectives:
    - Substituir prisma-migration-review quando o risco central for evolução do schema e deploy.
    - Fazer auditoria genérica de segurança sem invariante de dados concreta.
    - Executar escrita em banco compartilhado ou aplicar correções durante review.
invocation:
  mode: both
  triggers:
    - Operação composta, batch, replace, exclusão ou job com risco de estado parcial.
    - Cálculo monetário, Decimal, total ou arredondamento persistido.
    - Retry, idempotência, alocação sequencial ou escrita concorrente.
  anti_triggers:
    - Mudança exclusiva de schema, lock e backfill, tratada por prisma-migration-review.
    - Comparação exclusiva de contrato público entre front e back.
    - Mudança visual sem efeito em payload ou persistência.
input:
  mode: contextual
  parameters:
    - name: target
      type: string-or-artifact
      required: true
      origin: Pedido do usuário, diff, PR, service, job ou operação local.
      validation: Deve identificar escritas, cálculos, relações ou efeitos cujo estado válido possa ser definido.
      default: null
      example: sincronização batch da matriz de uma Ficha Técnica
      description: Operação cuja integridade será auditada.
    - name: failure_model
      type: array
      required: false
      origin: Fronteiras observadas no código e riscos informados.
      validation: Cada falha deve corresponder a uma leitura, escrita, commit, resposta ou efeito real.
      default: [falha-intermediaria, retry, concorrencia]
      example: falha entre deleteMany e createMany
      description: Falhas e interleavings que precisam ser executados ou modelados.
  artifacts:
    - AGENTS.md
    - docs/ai/DOMAIN_INVARIANTS.md
    - services, schema, constraints e testes afetados
  preconditions:
    - O estado válido antes e depois pode ser descrito.
    - Todas as escritas e efeitos externos relevantes foram localizados ou declarados ausentes.
    - Nenhum banco compartilhado será modificado.
output:
  format: markdown
  artifact: null
  required_sections:
    - Estado válido antes e depois
    - Fronteiras transacionais
    - Cenários de falha, retry e concorrência
    - Findings, descartes e limitações
  no_findings: Declarar nenhum finding mantido e registrar os cenários realmente cobertos.
  insufficient_evidence: Classificar atomicidade ou precisão como não comprovada e indicar código, constraint, isolamento ou efeito externo necessário.
  limitations:
    - Registrar falhas não induzidas e isolamento de banco não disponível.
    - Separar atomicidade do banco de efeitos externos fora da transação.
  prohibited_claims:
    - Não declarar atomicidade apenas porque existe uma transação parcial.
    - Não considerar build ou teste unitário isolado como prova de concorrência.
workflow:
  required_steps:
    - Aplicar AGENTS.md e invariantes de dados e domínio afetadas.
    - Mapear estado, leituras, escritas, efeitos, resposta e rollback.
    - Verificar validação integral, transação, constraints, precisão e exclusão.
    - Induzir ou modelar falhas, retry e interleavings concorrentes.
    - Contestar candidatos e entregar correção mínima e regressão verificável.
  improvisation: O agente pode escolher mecanismo de concorrência ou precisão conforme a causa comprovada, sem prescrever lock amplo ou política de retenção inexistente.
permissions:
  tools:
    - { name: filesystem-read, access: allow, enforcement: documented }
    - { name: grep-glob, access: allow, enforcement: documented }
    - { name: shell-readonly, access: allow, enforcement: documented }
    - { name: database-local-test, access: ask, enforcement: human-gated }
    - { name: local-edit, access: deny, enforcement: documented }
    - { name: database-shared-write, access: deny, enforcement: enforced }
    - { name: github-write, access: deny, enforcement: documented }
  bash:
    - git status --short
    - git diff e git show sobre o escopo
    - testes não destrutivos e bancos locais descartáveis já configurados
  network: deny
  external_write: deny
resources:
  references: [references/protocol.md]
  scripts: []
  assets: []
composition:
  complements:
    - prisma-migration-review quando schema ou migration também muda
    - tenant-isolation-review quando relações podem cruzar fábricas
    - kanban-transition-review para a máquina de estados da produção
  does_not_replace:
    - api-contract-review para convivência entre produtor e consumidor
    - authorization-review para decidir quem pode executar a operação
evaluation:
  behavioral: evals/evals.json
  triggers: evals/trigger-evals.json
  legacy_source: ../../evals/data-integrity-review/cases.json
  minimum_categories: { positive: 5, negative: 5, adversarial: 3, prompt_injection: 1, insufficient_evidence: 1 }
  minimum_trigger_cases: 10
examples:
  positive: Audite a substituição da matriz da ficha contra falha entre exclusão e recriação, retry e duas edições concorrentes.
  negative: Avalie somente a coluna NOT NULL e o backfill de uma migration sem analisar a operação de negócio.
  output: "## Estado e fronteiras\nEstado anterior, escritas e efeitos.\n\n## Cenários\nFalha concreta, estado resultante, finding ou `Nenhum finding mantido`."
