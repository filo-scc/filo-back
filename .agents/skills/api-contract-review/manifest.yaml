schema_version: "1.0"
identity:
  name: api-contract-review
  display_name: API Contract Review
  summary: Compara o contrato observável entre backend, frontend e versões em convivência durante o deploy.
governance:
  owner: Gheyson
  reviewers:
    - Arthur Capistrano
  lifecycle_status: ativa-informativa
  last_review: 2026-09-12
  next_review: 2026-11-30
scope:
  repositories: [filo-back, filo-front]
  canonical_repository: filo-back
  objective: Provar que produtores e consumidores representam campos, erros e comportamentos compatíveis antes, durante e depois do deploy.
  non_objectives:
    - Revisar lógica interna sem efeito observável por consumidor.
    - Substituir revisão de migration, autorização ou isolamento quando esses forem o risco central.
    - Implementar adaptações ou publicar findings sem autorização.
invocation:
  mode: both
  triggers:
    - Mudança em endpoint, DTO, payload, enum, nulabilidade, status ou erro público.
    - Alteração em service do frontend ou serialização do backend.
    - Necessidade de definir ordem de deploy e janela de convivência.
  anti_triggers:
    - Refatoração interna sem consumidor ou contrato externo.
    - Migration cujo risco central seja dados existentes, lock ou backfill.
    - Investigação exclusiva de autorização por recurso.
input:
  mode: contextual
  parameters:
    - name: target
      type: string-or-artifact
      required: true
      origin: Pedido do usuário, diff, PR ou arquivos locais.
      validation: Deve identificar um endpoint, DTO, payload, consumidor ou fluxo compartilhado acessível.
      default: null
      example: POST /pedidos e src/services/pedidoService.js
      description: Mudança de contrato que será comparada.
    - name: versions
      type: object
      required: false
      origin: Metadados do PR, refs Git ou versões informadas.
      validation: Base e head devem ser verificáveis; lados ausentes precisam ser declarados.
      default: versões disponíveis no workspace
      example: "back: develop..feature; front: versão publicada"
      description: Versões de produtor e consumidores consideradas na convivência.
  artifacts:
    - AGENTS.md dos repositórios analisados
    - docs/ai/DOMAIN_INVARIANTS.md
    - DTOs, services, testes e exemplos de erro afetados
  preconditions:
    - Pelo menos um produtor ou consumidor real está disponível.
    - A identidade das versões analisadas foi fixada ou declarada como limitação.
    - Exemplos e fixtures estão sanitizados.
output:
  format: markdown
  artifact: null
  required_sections:
    - Matriz produtor × consumidor
    - Consumidores encontrados
    - Combinações de versões e compatibilidade
    - Ordem de deploy e rollback
    - Findings, descartes e limitações
  no_findings: Declarar contrato compatível no escopo comprovado, sem afirmar compatibilidade de consumidores não inspecionados.
  insufficient_evidence: Classificar o contrato como não comprovado e indicar o produtor, consumidor, versão ou erro necessário.
  limitations:
    - Registrar repositório, versão, consumidor ou ambiente indisponível.
    - Diferenciar check estrutural de prova de compatibilidade funcional.
  prohibited_claims:
    - Não declarar compatibilidade apenas porque build, lint ou tipos passaram.
    - Não tratar coerção acidental do frontend como contrato oficial.
workflow:
  required_steps:
    - Aplicar AGENTS.md e as invariantes do fluxo afetado.
    - Fixar produtor, consumidores, base, head e estados de deploy.
    - Comparar request, response, erros e efeitos observáveis.
    - Testar conceitualmente as quatro combinações de versões.
    - Contestar diferenças e produzir a saída com evidências e limitações.
  improvisation: O agente pode escolher buscas e checks não destrutivos proporcionais, sem inventar o lado ausente ou expandir para revisão interna sem contrato.
permissions:
  tools:
    - { name: filesystem-read, access: allow, enforcement: documented }
    - { name: grep-glob, access: allow, enforcement: documented }
    - { name: shell-readonly, access: allow, enforcement: documented }
    - { name: github-read, access: ask, enforcement: human-gated }
    - { name: local-edit, access: deny, enforcement: documented }
    - { name: database-write, access: deny, enforcement: documented }
    - { name: github-write, access: deny, enforcement: documented }
  bash:
    - git status --short
    - git diff e git show sobre refs verificadas
    - checks não destrutivos previstos nos AGENTS.md
  network: ask
  external_write: deny
resources:
  references: [references/protocol.md]
  scripts: []
  assets: []
composition:
  complements:
    - prisma-migration-review quando o schema persistido muda
    - authorization-review quando status ou payload dependem de capacidade
    - github-pr-review quando a análise ocorre dentro de um PR completo
  does_not_replace:
    - tenant-isolation-review para provar enforcement entre fábricas
    - data-integrity-review para atomicidade e concorrência internas
evaluation:
  behavioral: evals/evals.json
  triggers: evals/trigger-evals.json
  legacy_source: ../../evals/api-contract-review/cases.json
  minimum_categories: { positive: 5, negative: 5, adversarial: 3, prompt_injection: 1, insufficient_evidence: 1 }
  minimum_trigger_cases: 10
examples:
  positive: Compare o novo campo produzida_em do backend com o frontend publicado e defina uma ordem segura de deploy.
  negative: Revise uma função privada que apenas reorganiza variáveis e não altera resposta, erro ou consumidor.
  output: "## Matriz produtor × consumidor\n| Elemento | Back antes/depois | Front antes/depois | Compatibilidade | Evidência |\n\n## Ordem de deploy\nBack-first, front-first ou contrato não comprovado, com justificativa."
