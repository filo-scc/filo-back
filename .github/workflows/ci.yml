name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Lint, Format & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --config.only-built-dependencies-schema=false

      - name: Verificar Lint e Formatação
        run: |
          pnpm exec prettier --check .
          pnpm lint

      - name: Gerar Prisma Client
        run: pnpm exec prisma generate

      - name: Build da aplicação
        run: pnpm build

  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    needs: validate-and-build
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/unused"
      JWT_ACCESS_SECRET: "test_secret"
      JWT_REFRESH_SECRET: "test_secret"

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --config.only-built-dependencies-schema=false

      - name: Gerar Prisma Client
        run: pnpm exec prisma generate

      - name: Executar Testes
        continue-on-error: false
        run: pnpm test:cov

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  validate-production-image:
    name: Validate Production Image
    runs-on: ubuntu-latest
    needs: [validate-and-build, test]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build da imagem de produção
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: false

  publish-production-image:
    name: Publish Production Image
    runs-on: ubuntu-latest
    needs: [validate-and-build, test, validate-production-image]
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
