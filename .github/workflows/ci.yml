name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate-and-build:
    name: Lint, Format & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --config.only-built-dependencies-schema=false

      - name: Verificar Lint e Formatação
        run: |
          pnpm exec prettier --check .
          pnpm lint

      - name: Gerar Prisma Client
        run: pnpm prisma generate

      - name: Build da aplicação
        run: pnpm build

  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    needs: validate-and-build
    env:
      # Banco mock para testes unitários
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/unused"
      JWT_ACCESS_SECRET: "test_secret"
      JWT_REFRESH_SECRET: "test_secret"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --config.only-built-dependencies-schema=false
      - run: pnpm prisma generate

      - name: Executar Testes
        continue-on-error: true
        run: pnpm test:cov

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  migrate:
    name: Prisma Migrate Deploy
    runs-on: ubuntu-latest
    needs: [validate-and-build, test]

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    env:
      DATABASE_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --config.only-built-dependencies-schema=false

      - name: Executar migrações
        run: pnpm prisma migrate deploy
