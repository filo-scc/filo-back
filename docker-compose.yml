# =============================================================================
# docker-compose.yml — Stack de Desenvolvimento (Backend Filo)
# =============================================================================
#
# Modos de uso:
#   🐳 Docker completo (API + banco):   docker compose up
#   💻 Apenas o banco (API rodando local): docker compose up db
#
# =============================================================================
services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: filo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 5433 no host → evita conflito com Postgres local rodando em 5432.
      # Devs rodando a API local conectam via localhost:5433.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - filo-network

  # ── Backend NestJS ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: filo-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      # DATABASE_URL é fixado aqui com @db (nome do serviço no compose).
      # Isso sobrescreve o valor do .env, que usa @localhost:5433 para uso local.
      # Assim o mesmo .env funciona para os dois modos sem nenhuma alteração.
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      PORT: ${PORT:-3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      RUN_SEED: ${RUN_SEED:-false}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/node_modules/.prisma
    networks:
      - filo-network

networks:
  filo-network:
    name: filo-network
    driver: bridge

volumes:
  postgres_data: